<!DOCTYPE html>
<html>
<head>
  <title>Janta Shree</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #F1EFE8;
      color: #2C2C2A;
      padding: 24px;
    }

    h1 {
      font-size: 20px;
      font-weight: 500;
      margin-bottom: 20px;
    }

    table {
      border-collapse: collapse;
      width: 100%;
      background-color: #FFFFFF;
      border-radius: 8px;
      overflow: hidden;
    }

    th {
      background-color: #E6F1FB;
      color: #185FA5;
      text-align: left;
      padding: 12px 16px;
      font-size: 13px;
      font-weight: 500;
    }

    td {
      padding: 12px 16px;
      font-size: 14px;
      border-top: 1px solid #E3E1D8;
    }

    .badge {
      background-color: #E6F1FB;
      color: #185FA5;
      font-size: 11px;
      padding: 3px 9px;
      border-radius: 20px;
    }

    button {
      background-color: #185FA5;
      color: #FFFFFF;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .delete-btn {
      background-color: #FAECE7;
      color: #A32D2D;
      padding: 4px 10px;
      font-size: 12px;
    }

    .form-row {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    input, select {
      padding: 8px 12px;
      border: 1px solid #E3E1D8;
      border-radius: 6px;
      font-size: 13px;
      font-family: Arial, sans-serif;
    }
  </style>
</head>
<body>

  <h1>Janta Shree — Items & Stock</h1>

  <div class="form-row">
    <input type="text" id="nameInput" placeholder="Item name">
    <input type="text" id="categoryInput" placeholder="Category">
    <select id="unitInput">
      <option value="NOS">NOS</option>
      <option value="KG">KG</option>
      <option value="Liter">Liter</option>
    </select>
    <input type="text" id="stockInput" placeholder="In stock">
    <button id="addBtn">+ Add Item</button>
  </div>

  <table id="itemTable">
    <tr>
      <th>Item</th>
      <th>Category</th>
      <th>Unit</th>
      <th>In Stock</th>
      <th></th>
    </tr>
  </table>

  <script>
    const addBtn = document.getElementById("addBtn");
    const table = document.getElementById("itemTable");

    const nameInput = document.getElementById("nameInput");
    const categoryInput = document.getElementById("categoryInput");
    const unitInput = document.getElementById("unitInput");
    const stockInput = document.getElementById("stockInput");

    let items = [];

    function saveItems() {
      localStorage.setItem("items", JSON.stringify(items));
    }

    function renderTable() {
      // remove all rows except the header row
      while (table.rows.length > 1) {
        table.deleteRow(1);
      }

      items.forEach(function(item, index) {
        const newRow = table.insertRow();
        newRow.insertCell().textContent = item.name;
        newRow.insertCell().innerHTML = `<span class="badge">${item.category}</span>`;
        newRow.insertCell().textContent = item.unit;
        newRow.insertCell().textContent = item.stock;

        const actionCell = newRow.insertCell();
        const delBtn = document.createElement("button");
        delBtn.textContent = "Delete";
        delBtn.className = "delete-btn";
        delBtn.addEventListener("click", function() {
          items.splice(index, 1);
          saveItems();
          renderTable();
        });
        actionCell.appendChild(delBtn);
      });
    }

    function loadItems() {
      const saved = localStorage.getItem("items");
      items = saved ? JSON.parse(saved) : [
        { name: "OPC 43 Cement", category: "Cement", unit: "NOS", stock: "420 bags" },
        { name: "TMT Steel 12mm", category: "Steel", unit: "KG", stock: "2,180 kg" },
        { name: "Binding Wire", category: "Wire", unit: "KG", stock: "96 kg" }
      ];
      renderTable();
    }

    loadItems();

    addBtn.addEventListener("click", function() {
      items.push({
        name: nameInput.value,
        category: categoryInput.value,
        unit: unitInput.value,
        stock: stockInput.value
      });

      saveItems();
      renderTable();

      nameInput.value = "";
      categoryInput.value = "";
      stockInput.value = "";
    });
  </script>

</body>
</html>
